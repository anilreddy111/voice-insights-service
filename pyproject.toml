[project]
name = "voice-insights-service"
version = "1.0.0"
description = "Real-time caller attribute inference (gender + age bracket) from audio streams"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI dependency injection uses call-in-default

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that download real model weights (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"
